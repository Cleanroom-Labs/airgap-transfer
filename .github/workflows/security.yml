name: Security

on:
  schedule:
    - cron: "0 12 * * 1" # Monday 12:00 UTC (6am CST)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: License & advisory check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  vet:
    name: Dependency audit (cargo-vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet
      - name: Run cargo vet
        run: cargo vet --locked

  crev:
    name: Community trust check (cargo-crev)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-crev
        run: cargo install --locked cargo-crev
      - name: Fetch community reviews
        run: cargo crev repo fetch all || true
      - name: Verify dependencies
        run: cargo crev crate verify || true

  auditable:
    name: Auditable build & binary audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-auditable and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable,cargo-audit
      - name: Build auditable release binary
        run: cargo auditable build --release
      - name: Audit built binary
        run: cargo audit bin target/release/airgap-transfer

  trivy:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write      # required for SARIF upload to GitHub Security tab
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable
      - name: Build auditable release binary
        run: cargo auditable build --release
      # SARIF upload — all findings, no blocking, feeds GitHub Security tab
      - name: Scan filesystem (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          exit-code: '0'
      - name: Upload filesystem SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs.sarif'
          category: 'trivy-filesystem'
      # Blocking scans — enforce severity policy
      - name: Scan filesystem for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
      - name: Scan binary for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'target/release/airgap-transfer'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  geiger-baseline:
    name: Geiger baseline snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: Run geiger and capture baseline
        run: cargo geiger --output-format Json 2>/dev/null > geiger-baseline.json
      - name: Upload geiger baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: geiger-baseline
          path: geiger-baseline.json
          overwrite: true
      - name: Write step summary
        run: |
          COUNT=$(jq '[.packages[].unsafety.used.exprs.unsafe_] | add // 0' geiger-baseline.json)
          echo "## cargo-geiger baseline (main)" >> $GITHUB_STEP_SUMMARY
          echo "Unsafe expressions on main: **$COUNT**" >> $GITHUB_STEP_SUMMARY
